<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8"/>
    <title>Docentes · Saber Pro</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>
<div class="app-wrapper">
    <div th:replace="~{fragments/layout :: sidebar-admin}"></div>

    <main class="main-content">
        <header class="topbar">
            <div class="topbar-title">
                <h1><i class="fa fa-chalkboard-teacher" style="color:var(--accent);"></i> &nbsp;Docentes</h1>
                <p>Administración del personal docente</p>
            </div>
            <div class="topbar-right">
                <button onclick="document.getElementById('modalDocente').style.display='flex'"
                        class="btn btn-accent">
                    <i class="fa fa-plus"></i> Nuevo Docente
                </button>
            </div>
        </header>

        <div class="page-body">
            <div th:if="${success}" class="alert alert-success">
                <i class="fa fa-check-circle"></i> <span th:text="${success}"></span>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <h2><i class="fa fa-list"></i> Listado de Docentes (<span th:text="${#lists.size(docentes)}">0</span>)</h2>
                </div>
                <div class="table-wrapper">
                    <table class="sp-table">
                        <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Cédula</th>
                            <th>Email</th>
                            <th>Facultad</th>
                            <th>Departamento</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="doc : ${docentes}">
                            <td>
                                <div style="display:flex; align-items:center; gap:10px;">
                                    <div style="width:34px; height:34px; background:var(--primary); color:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; flex-shrink:0;"
                                         th:text="${doc.nombre.substring(0,1)}"></div>
                                    <div>
                                        <strong th:text="${doc.nombre + ' ' + doc.apellido}"></strong><br/>
                                        <small style="color:var(--text-muted);" th:text="${doc.email}"></small>
                                    </div>
                                </div>
                            </td>
                            <td th:text="${doc.cedula}"></td>
                            <td th:text="${doc.email}"></td>
                            <td th:text="${doc.facultad}"></td>
                            <td th:text="${doc.departamento}"></td>
                            <td>
                                <span th:if="${doc.activo}" class="badge-aprobado">Activo</span>
                                <span th:unless="${doc.activo}" class="badge-rechazado">Inactivo</span>
                            </td>
                            <td>
                                <a th:href="@{/admin/docentes/eliminar/{id}(id=${doc.id})}"
                                   class="btn btn-danger btn-sm"
                                   onclick="return confirm('¿Desactivar este docente?')">
                                    <i class="fa fa-ban"></i>
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(docentes)}">
                            <td colspan="7" style="text-align:center; padding:30px; color:var(--text-muted);">
                                No hay docentes registrados
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>

<!-- Modal Nuevo Docente -->
<div id="modalDocente" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:999; align-items:center; justify-content:center;">
    <div style="background:#fff; border-radius:16px; padding:32px; width:100%; max-width:500px; box-shadow:var(--shadow-md);">
        <div style="display:flex; justify-content:space-between; margin-bottom:22px;">
            <h2 style="font-size:17px; color:var(--primary-dark);">Registrar Docente</h2>
            <button onclick="document.getElementById('modalDocente').style.display='none'"
                    style="border:none; background:none; font-size:18px; cursor:pointer;">✕</button>
        </div>
        <form th:action="@{/admin/docentes/guardar}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="grid-2">
                <div class="form-group">
                    <label>Nombre</label>
                    <input type="text" name="nombre" class="form-control" required/>
                </div>
                <div class="form-group">
                    <label>Apellido</label>
                    <input type="text" name="apellido" class="form-control" required/>
                </div>
            </div>
            <div class="form-group">
                <label>Cédula</label>
                <input type="text" name="cedula" class="form-control" required/>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" class="form-control" required/>
            </div>
            <div class="form-group">
                <label>Facultad</label>
                <input type="text" name="facultad" class="form-control" required/>
            </div>
            <div class="form-group">
                <label>Departamento</label>
                <input type="text" name="departamento" class="form-control" required/>
            </div>
            <div style="display:flex; gap:10px; justify-content:flex-end;">
                <button type="button" onclick="document.getElementById('modalDocente').style.display='none'"
                        class="btn btn-outline">Cancelar</button>
                <button type="submit" class="btn btn-primary">
                    <i class="fa fa-save"></i> Guardar
                </button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
