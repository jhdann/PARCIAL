<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8"/>
    <title>Informe · Docente · Saber Pro</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>
<div class="app-wrapper">
    <div th:replace="~{fragments/layout :: sidebar-docente}"></div>

    <main class="main-content">
        <header class="topbar">
            <div class="topbar-title">
                <h1><i class="fa fa-chart-bar" style="color:var(--accent);"></i> &nbsp;Informe de Resultados</h1>
                <p>Ranking y competencias de todos los estudiantes</p>
            </div>
        </header>

        <div class="page-body">
            <div class="stats-grid" style="margin-bottom:24px;">
                <div class="stat-card"><div class="stat-icon">📊</div>
                    <div class="stat-info"><h3 th:text="${promedioTec}">0</h3><p>Prom. Tecnología</p></div></div>
                <div class="stat-card accent"><div class="stat-icon">📈</div>
                    <div class="stat-info"><h3 th:text="${promedioProf}">0</h3><p>Prom. Profesional</p></div></div>
                <div class="stat-card info"><div class="stat-icon">📋</div>
                    <div class="stat-info"><h3 th:text="${#lists.size(resultados)}">0</h3><p>Con resultado</p></div></div>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <h2><i class="fa fa-trophy"></i> Ranking General por Puntaje</h2>
                </div>
                <div class="table-wrapper">
                    <table class="sp-table">
                        <thead>
                        <tr>
                            <th>Pos.</th>
                            <th>Estudiante</th>
                            <th>Programa</th>
                            <th>Puntaje</th>
                            <th>Nivel</th>
                            <th>Com. Esc.</th>
                            <th>Raz. Cuant.</th>
                            <th>Lect. Crít.</th>
                            <th>Inglés</th>
                            <th>Diseño Sw.</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="r, i : ${resultados}">
                            <td>
                                <span th:if="${i.index == 0}">🥇</span>
                                <span th:if="${i.index == 1}">🥈</span>
                                <span th:if="${i.index == 2}">🥉</span>
                                <span th:if="${i.index >= 3}" style="color:var(--text-muted); font-weight:700;" th:text="${i.count}"></span>
                            </td>
                            <td>
                                <strong th:text="${r.estudiante.primerNombre + ' ' + r.estudiante.primerApellido}"></strong>
                            </td>
                            <td>
                                <span class="badge-tec" th:if="${r.estudiante.tipoPrograma.name() == 'TECNOLOGIA'}">TEC</span>
                                <span class="badge-prof" th:if="${r.estudiante.tipoPrograma.name() == 'PROFESIONAL'}">PROF</span>
                            </td>
                            <td><strong style="font-size:15px; color:var(--primary-dark);" th:text="${r.puntajeTotal}"></strong></td>
                            <td>
                                <span class="nivel-badge"
                                      th:classappend="${r.nivelTotal == 'Nivel 4'} ? 'nivel-4' : (${r.nivelTotal == 'Nivel 3'} ? 'nivel-3' : (${r.nivelTotal == 'Nivel 2'} ? 'nivel-2' : 'nivel-1'))"
                                      th:text="${r.nivelTotal}"></span>
                            </td>
                            <td th:text="${r.comunicacionEscrita}"></td>
                            <td th:text="${r.razonamientoCuantitativo}"></td>
                            <td th:text="${r.lecturaCritica}"></td>
                            <td><span th:text="${r.ingles}"></span> <small style="color:var(--text-muted);" th:text="'(' + ${r.nivelInglesLetra} + ')'"></small></td>
                            <td th:text="${r.disenoSoftware}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>
</body>
</html>
