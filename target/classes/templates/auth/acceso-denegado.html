<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8"/>
    <title>Acceso Denegado · Saber Pro</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>
<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg);">
    <div style="text-align:center; max-width:420px; padding:40px; background:#fff; border-radius:var(--radius); box-shadow:var(--shadow-md);">
        <div style="font-size:72px; margin-bottom:16px;">🚫</div>
        <h1 style="font-size:22px; color:var(--primary-dark); margin-bottom:8px;">Acceso Denegado</h1>
        <p style="color:var(--text-muted); margin-bottom:24px; font-size:14px; line-height:1.6;">
            No tienes permisos para acceder a esta sección. Si crees que esto es un error, contacta al administrador del sistema.
        </p>
        <a th:href="@{/auth/login}" class="btn btn-primary">
            <i class="fa fa-arrow-left"></i> Volver al Login
        </a>
    </div>
</div>
</body>
</html>
