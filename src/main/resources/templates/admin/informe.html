<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8"/>
    <title>Informe Global · Saber Pro</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>
<div class="app-wrapper">
    <div th:replace="~{fragments/layout :: sidebar-admin}"></div>

    <main class="main-content">
        <header class="topbar">
            <div class="topbar-title">
                <h1><i class="fa fa-chart-bar" style="color:var(--accent);"></i> &nbsp;Informe Global</h1>
                <p>Resultados completos Saber Pro 2026</p>
            </div>
            <div class="topbar-right">
                <span class="badge-rol">Administrador</span>
            </div>
        </header>

        <div class="page-body">

            <div class="stats-grid" style="grid-template-columns: repeat(2, 1fr); max-width:500px; margin-bottom:24px;">
                <div class="stat-card">
                    <div class="stat-icon">📊</div>
                    <div class="stat-info">
                        <h3 th:text="${promedioTec}">0</h3>
                        <p>Prom. Tecnología</p>
                    </div>
                </div>
                <div class="stat-card accent">
                    <div class="stat-icon">📈</div>
                    <div class="stat-info">
                        <h3 th:text="${promedioProf}">0</h3>
                        <p>Prom. Profesional</p>
                    </div>
                </div>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <h2><i class="fa fa-table"></i> Resultados por Estudiante</h2>
                    <span style="font-size:12px; color:var(--text-muted);" th:text="${#lists.size(resultados)} + ' registros'"></span>
                </div>
                <div class="table-wrapper">
                    <table class="sp-table">
                        <thead>
                        <tr>
                            <th>Pos</th>
                            <th>Estudiante</th>
                            <th>Programa</th>
                            <th>Puntaje</th>
                            <th>Nivel</th>
                            <th>Com. Escrita</th>
                            <th>Raz. Cuant.</th>
                            <th>Lect. Crít.</th>
                            <th>Comp. Ciu.</th>
                            <th>Inglés</th>
                            <th>Diseño Sw</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="r, i : ${resultados}">
                            <td style="font-weight:700; color:var(--text-muted);" th:text="${i.index + 1}"></td>
                            <td>
                                <strong th:text="${r.estudiante.primerNombre + ' ' + r.estudiante.primerApellido}"></strong><br/>
                                <small style="color:var(--text-muted);" th:text="${r.estudiante.numeroRegistro}"></small>
                            </td>
                            <td>
                                <span class="badge-tec" th:if="${r.estudiante.tipoPrograma.name() == 'TECNOLOGIA'}">TEC</span>
                                <span class="badge-prof" th:if="${r.estudiante.tipoPrograma.name() == 'PROFESIONAL'}">PROF</span>
                            </td>
                            <td><strong th:text="${r.puntajeTotal}" style="font-size:15px; color:var(--primary-dark);"></strong></td>
                            <td>
                                <span class="nivel-badge"
                                      th:classappend="${r.nivelTotal == 'Nivel 4'} ? 'nivel-4' : (${r.nivelTotal == 'Nivel 3'} ? 'nivel-3' : (${r.nivelTotal == 'Nivel 2'} ? 'nivel-2' : 'nivel-1'))"
                                      th:text="${r.nivelTotal}"></span>
                            </td>
                            <td th:text="${r.comunicacionEscrita}"></td>
                            <td th:text="${r.razonamientoCuantitativo}"></td>
                            <td th:text="${r.lecturaCritica}"></td>
                            <td th:text="${r.competenciasCiudadanas}"></td>
                            <td>
                                <span th:text="${r.ingles}"></span>
                                <small style="color:var(--text-muted);" th:text="'(' + ${r.nivelInglesLetra} + ')'"></small>
                            </td>
                            <td th:text="${r.disenoSoftware}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>
</body>
</html>
